<!DOCTYPE html>
<html data-theme="dark" lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ThinkPrint</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-base-200 min-h-screen flex items-center justify-center px-4">

  <button id="theme-toggle" onclick="toggleTheme()"
    class="btn btn-ghost btn-sm btn-circle fixed top-4 right-4">☀️</button>

  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">

      <div class="text-center mb-6">
        <a href="index.html" class="text-2xl font-bold">Think<span class="text-primary">Print</span></a>
        <p class="text-base-content/50 text-sm mt-1">AI Readiness Verification Platform</p>
      </div>

      <h2 class="text-xl font-bold text-center mb-1">Welcome back</h2>
      <p class="text-center text-base-content/50 text-sm mb-6">Sign in to your account</p>

      <div id="error-alert" class="alert alert-error hidden mb-4">
        <span id="error-message"></span>
      </div>

      <div class="form-control mb-3">
        <label class="label"><span class="label-text font-medium">Email</span></label>
        <input type="email" id="email" placeholder="you@company.com" class="input input-bordered w-full">
      </div>

      <div class="form-control mb-1">
        <label class="label"><span class="label-text font-medium">Password</span></label>
        <input type="password" id="password" placeholder="Your password" class="input input-bordered w-full">
      </div>

      <div class="text-right mb-6">
        <a href="password-reset.html" class="text-sm text-primary link link-hover">Forgot password?</a>
      </div>

      <button id="login-btn" onclick="handleLogin()" class="btn btn-primary w-full">Sign In</button>

      <div class="divider text-xs">Don't have an account?</div>
      <a href="signup.html" class="btn btn-outline w-full">Create Account Free</a>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script>
    async function handleLogin() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const btn = document.getElementById('login-btn')
      const errorAlert = document.getElementById('error-alert')

      errorAlert.classList.add('hidden')

      if (!email || !password) {
        document.getElementById('error-message').textContent = 'Please fill in all fields.'
        errorAlert.classList.remove('hidden')
        return
      }

      btn.disabled = true
      btn.innerHTML = '<span class="loading loading-spinner loading-sm"></span> Signing in...'

      const { data, error } = await db.auth.signInWithPassword({ email, password })

      if (error) {
        document.getElementById('error-message').textContent = error.message
        errorAlert.classList.remove('hidden')
        btn.disabled = false
        btn.innerHTML = 'Sign In'
        return
      }

      const { data: profile } = await db
        .from('profiles')
        .select('role')
        .eq('id', data.user.id)
        .single()

      window.location.href = profile?.role === 'admin' ? 'org-dashboard.html' : 'dashboard.html'
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin() })
  </script>
</body>

</html>
