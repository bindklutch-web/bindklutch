<!DOCTYPE html>
<html data-theme="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ThinkPrint</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center px-4">

  <button id="theme-toggle" onclick="toggleTheme()" class="btn btn-ghost btn-sm btn-circle fixed top-4 right-4">☀️</button>

  <!-- Request reset form -->
  <div id="screen-request" class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <div class="text-center mb-6">
        <a href="index.html" class="text-2xl font-bold">Think<span class="text-primary">Print</span></a>
        <p class="text-base-content/50 text-sm mt-1">Password Reset</p>
      </div>

      <h2 class="text-xl font-bold text-center mb-1">Forgot your password?</h2>
      <p class="text-center text-base-content/50 text-sm mb-6">Enter your email and we'll send you a reset link.</p>

      <div id="request-error" class="alert alert-error hidden mb-4">
        <span id="request-error-msg"></span>
      </div>
      <div id="request-success" class="alert alert-success hidden mb-4">
        <span>Reset link sent. Check your inbox.</span>
      </div>

      <div class="form-control mb-4">
        <label class="label"><span class="label-text font-medium">Email</span></label>
        <input type="email" id="reset-email" placeholder="you@company.com" class="input input-bordered w-full">
      </div>

      <button id="reset-btn" onclick="handleResetRequest()" class="btn btn-primary w-full">
        Send Reset Link
      </button>

      <div class="divider text-xs">Remembered it?</div>
      <a href="login.html" class="btn btn-outline w-full">Back to Sign In</a>
    </div>
  </div>

  <!-- New password form — shown when token is in URL -->
  <div id="screen-new-password" class="card w-full max-w-md bg-base-100 shadow-xl hidden">
    <div class="card-body">
      <div class="text-center mb-6">
        <a href="index.html" class="text-2xl font-bold">Think<span class="text-primary">Print</span></a>
        <p class="text-base-content/50 text-sm mt-1">Set New Password</p>
      </div>

      <h2 class="text-xl font-bold text-center mb-1">Create a new password</h2>
      <p class="text-center text-base-content/50 text-sm mb-6">Choose something secure and memorable.</p>

      <div id="new-error" class="alert alert-error hidden mb-4">
        <span id="new-error-msg"></span>
      </div>

      <div class="form-control mb-3">
        <label class="label"><span class="label-text font-medium">New Password</span></label>
        <input type="password" id="new-password" placeholder="Minimum 8 characters" class="input input-bordered w-full">
      </div>

      <div class="form-control mb-6">
        <label class="label"><span class="label-text font-medium">Confirm Password</span></label>
        <input type="password" id="confirm-password" placeholder="Repeat your password" class="input input-bordered w-full">
      </div>

      <button id="update-btn" onclick="handlePasswordUpdate()" class="btn btn-primary w-full">
        Update Password
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/theme.js"></script>
  <script>

    // Check if we have a recovery token in the URL
    async function init() {
      const hash = window.location.hash
      if (hash && hash.includes('type=recovery')) {
        document.getElementById('screen-request').classList.add('hidden')
        document.getElementById('screen-new-password').classList.remove('hidden')
      }
    }

    async function handleResetRequest() {
      const email = document.getElementById('reset-email').value.trim()
      const btn = document.getElementById('reset-btn')
      const errorEl = document.getElementById('request-error')
      const successEl = document.getElementById('request-success')

      errorEl.classList.add('hidden')
      successEl.classList.add('hidden')

      if (!email) {
        document.getElementById('request-error-msg').textContent = 'Please enter your email.'
        errorEl.classList.remove('hidden')
        return
      }

      btn.disabled = true
      btn.innerHTML = '<span class="loading loading-spinner loading-sm"></span> Sending...'

      const { error } = await db.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/password-reset.html'
      })

      if (error) {
        document.getElementById('request-error-msg').textContent = error.message
        errorEl.classList.remove('hidden')
        btn.disabled = false
        btn.innerHTML = 'Send Reset Link'
        return
      }

      successEl.classList.remove('hidden')
      btn.innerHTML = 'Link Sent ✓'
    }

    async function handlePasswordUpdate() {
      const newPass = document.getElementById('new-password').value
      const confirmPass = document.getElementById('confirm-password').value
      const btn = document.getElementById('update-btn')
      const errorEl = document.getElementById('new-error')

      errorEl.classList.add('hidden')

      if (newPass.length < 8) {
        document.getElementById('new-error-msg').textContent = 'Password must be at least 8 characters.'
        errorEl.classList.remove('hidden')
        return
      }

      if (newPass !== confirmPass) {
        document.getElementById('new-error-msg').textContent = 'Passwords do not match.'
        errorEl.classList.remove('hidden')
        return
      }

      btn.disabled = true
      btn.innerHTML = '<span class="loading loading-spinner loading-sm"></span> Updating...'

      const { error } = await db.auth.updateUser({ password: newPass })

      if (error) {
        document.getElementById('new-error-msg').textContent = error.message
        errorEl.classList.remove('hidden')
        btn.disabled = false
        btn.innerHTML = 'Update Password'
        return
      }

      btn.innerHTML = 'Password Updated ✓'
      setTimeout(() => window.location.href = 'dashboard.html', 1500)
    }

    init()
  </script>
</body>
</html>
